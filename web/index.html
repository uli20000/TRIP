<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰島｜同步測試版</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#23313a;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dfe6e5;border-radius:16px;padding:22px;box-shadow:0 6px 20px #20404a10;margin-bottom:16px}h1{margin:0 0 6px;font-size:30px}.muted{color:#6d7b80}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{min-height:42px}input,select,textarea{border:1px solid #d8e1e0;border-radius:9px;padding:10px 12px;background:#fff;font:inherit}input,select{min-width:220px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:#2877a9;color:#fff}.btn.gray{background:#edf3f2;color:#28414b}.btn.red{background:#fff0ee;color:#b5554c}.hidden{display:none!important}.status{padding:10px 12px;border-radius:9px;background:#eef5f4;color:#315b62;margin:12px 0}.status.error{background:#fff0ee;color:#9a3e37}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #e0e7e6;border-radius:12px;padding:15px;background:#fff}.card h3{margin:0 0 6px}.tag{font-size:12px;border-radius:999px;padding:3px 8px;background:#e7f2f8;color:#2673a2}.meta{font-size:14px;color:#627176;display:grid;gap:4px;margin-top:10px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form .full{grid-column:1/-1}.form label{display:grid;gap:5px;color:#637176;font-size:13px;font-weight:700}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{border-bottom:1px solid #e6eceb;padding:10px;text-align:left}.table th{font-size:13px;color:#6a797d;background:#f6f8f8}.small{font-size:13px}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginPanel" class="panel">
  <h1>冰島｜登入</h1><p class="muted">請登入後測試 Notion 景點與費用同步。</p>
  <form id="loginForm" class="form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>密碼<input id="password" type="password" required autocomplete="current-password"></label><div class="full"><button class="btn" type="submit">登入</button></div></form>
  <div id="loginStatus" class="status hidden"></div>
</section>
<section id="appPanel" class="hidden">
  <div class="panel"><div class="row" style="justify-content:space-between"><div><h1>冰島｜同步測試版</h1><div class="muted">先確認功能，UI 之後再美化。</div></div><button id="logout" class="btn red">登出</button></div><div id="appStatus" class="status">尚未同步</div><div class="row"><button id="syncTravel" class="btn">同步景點</button><button id="syncExpenses" class="btn gray">同步費用</button></div></div>
  <section class="panel"><h2>景點同步結果</h2><div id="travelList" class="grid"><div class="muted">尚未同步</div></div></section>
  <section class="panel"><h2>新增記帳</h2><form id="expenseForm" class="form"><label>項目<input id="expenseName" required placeholder="例如：藍湖門票"></label><label>類別<select id="expenseCategory"><option>婚禮</option><option>交通</option><option>住宿</option><option>機票</option><option>餐飲</option><option>景點／活動</option><option>購物</option><option>其他</option></select></label><label>狀態<select id="expenseStatus"><option>預估</option><option>待付款</option><option>已付款</option><option>取消</option></select></label><label>原幣別<select id="expenseCurrency"><option>ISK</option><option>TWD</option><option>EUR</option><option>USD</option></select></label><label>原始金額<input id="expenseOriginal" type="number" min="0" step="0.01"></label><label>台幣估算<input id="expenseTwd" type="number" min="0" step="0.01"></label><label>付款方式<select id="expenseMethod"><option>尚未付款</option><option>信用卡</option><option>現金</option><option>轉帳</option></select></label><label>備註<input id="expenseNotes" placeholder="可留空"></label><div class="full"><button class="btn" type="submit">儲存到 Notion</button></div></form></section>
  <section class="panel"><h2>費用同步結果</h2><div class="table-wrap"><table class="table"><thead><tr><th>項目</th><th>類別</th><th>狀態</th><th>幣別</th><th>原始金額</th><th>台幣估算</th></tr></thead><tbody id="expenseList"><tr><td colspan="6" class="muted">尚未同步</td></tr></tbody></table></div></section>
</section>
</div>
<script src="./config.js"></script>
<script>
const C=window.ICELAND_APP_CONFIG||{};let session=JSON.parse(localStorage.getItem('iceland-auth-session')||'null');
const $=id=>document.getElementById(id);const show=(id,on)=>$(id).classList.toggle('hidden',!on);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(text,error=false){const e=$('appStatus');e.textContent=text;e.className='status'+(error?' error':'')};function setLoginStatus(text,error=false){const e=$('loginStatus');e.textContent=text;e.className='status'+(error?' error':'')}
async function auth(path,body){const r=await fetch(`${C.supabaseUrl}/auth/v1/${path}`,{method:'POST',headers:{apikey:C.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'登入失敗');return j}
async function login(e){e.preventDefault();try{setLoginStatus('登入中…');const j=await auth('token?grant_type=password',{email:$('email').value,password:$('password').value});session=j;localStorage.setItem('iceland-auth-session',JSON.stringify(j));show('loginPanel',false);show('appPanel',true);setStatus('登入成功，請開始同步')}catch(err){setLoginStatus(err.message,true);show('loginStatus',true)}}
function logout(){session=null;localStorage.removeItem('iceland-auth-session');show('loginPanel',true);show('appPanel',false)}
async function api(kind,method='GET',body){if(!session?.access_token)throw new Error('請先登入');const url=new URL(C.syncFunctionUrl);url.searchParams.set('kind',kind);if(method==='GET')url.searchParams.set('content','false');const r=await fetch(url,{method,headers:{apikey:C.supabasePublishableKey,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||`同步失敗（${r.status}）`);return j}
function props(r){return r.properties||{}}
async function syncTravel(){try{setStatus('正在同步景點…');const j=await api('travel');const rows=j.records||[];$('travelList').innerHTML=rows.length?rows.map(r=>{const p=props(r);return `<article class="card"><h3>${esc(p.Name||'未命名景點')}</h3><span class="tag">${esc(p.標籤||'未分類')}</span><div class="meta"><div>日期：${esc(p.Time?.start||'未安排')}</div><div>摘要：${esc(p.內容摘要||'尚未填寫')}</div><div><a href="${esc(p['Google Maps 連結']||'#')}" target="_blank" rel="noreferrer">開啟地圖</a></div></div></article>`}).join(''):'<div class="muted">目前沒有景點資料。</div>';setStatus(`景點同步完成：${rows.length} 筆`)}catch(err){setStatus(err.message,true)}}
function renderExpenses(rows){$('expenseList').innerHTML=rows.length?rows.map(r=>{const p=props(r);return `<tr><td>${esc(p.Name||'')}</td><td>${esc(p.類別||'')}</td><td>${esc(p.狀態||'')}</td><td>${esc(p.原幣別||'')}</td><td>${esc(p.原始金額??'')}</td><td>${esc(p.台幣估算??'')}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted">目前沒有費用資料。</td></tr>'}
async function syncExpenses(){try{setStatus('正在同步費用…');const j=await api('expenses');renderExpenses(j.records||[]);setStatus(`費用同步完成：${(j.records||[]).length} 筆`)}catch(err){setStatus(err.message,true)}}
async function addExpense(e){e.preventDefault();try{setStatus('正在寫入 Notion…');await api('expenses','POST',{properties:{Name:$('expenseName').value,類別:$('expenseCategory').value,狀態:$('expenseStatus').value,原幣別:$('expenseCurrency').value,原始金額:$('expenseOriginal').value===''?'':Number($('expenseOriginal').value),台幣估算:$('expenseTwd').value===''?'':Number($('expenseTwd').value),付款方式:$('expenseMethod').value,備註:$('expenseNotes').value}});$('expenseForm').reset();await syncExpenses();setStatus('記帳已儲存到 Notion')}catch(err){setStatus(err.message,true)}}
$('loginForm').addEventListener('submit',login);$('logout').onclick=logout;$('syncTravel').onclick=syncTravel;$('syncExpenses').onclick=syncExpenses;$('expenseForm').addEventListener('submit',addExpense);if(session){show('loginPanel',false);show('appPanel',true)}
</script>
</body></html>
