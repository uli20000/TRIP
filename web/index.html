<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>冰島｜旅行工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <div id="appPanel">
        <div class="panel hero-panel">
          <div class="hero-kicker">
            <span class="hero-flag">🇮🇸</span> ICELAND · WEDDING TRIP · 10 DAYS
          </div>
          <h1>冰島｜旅行工作台</h1>
          <div class="hero-route">REYKJAVÍK · SOUTH COAST · AURORA</div>
          <div
            id="status"
            class="status"
            title="同步狀態"
            aria-label="同步狀態"
          >
            •
          </div>
        </div>
        <nav id="itineraryNav" class="tabs hidden">
          <button class="tab active" data-itinerary-tab="schedule">
            行事曆</button
          ><button class="tab" data-itinerary-tab="day1">D1</button
          ><button class="tab" data-itinerary-tab="day2">D2</button
          ><button class="tab" data-itinerary-tab="day3">D3</button
          ><button class="tab" data-itinerary-tab="day4">D4</button
          ><button class="tab" data-itinerary-tab="day5">D5</button
          ><button class="tab" data-itinerary-tab="day6">D6</button
          ><button class="tab" data-itinerary-tab="day7">D7</button
          ><button class="tab" data-itinerary-tab="day8">D8</button
          ><button class="tab" data-itinerary-tab="day9">D9</button
          ><button class="tab" data-itinerary-tab="day10">D10</button>
        </nav>
        <section id="overview" class="section">
          <div class="panel">
            <h2>總覽</h2>
            <button id="addExpenseJump" class="btn soft-action" type="button">
              記帳
            </button>
            <div id="overviewGrid" class="overview-grid"></div>
          </div>
        </section>
        <section id="spots" class="section active">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>景點小卡</h2>
              </div>
            </div>
            <div id="spotFilters" class="tabs" style="margin: 14px 0 0">
              <button class="tab active" data-spot-filter="全部">全部</button
              ><button class="tab" data-spot-filter="航班">航班</button
              ><button class="tab" data-spot-filter="交通">交通</button
              ><button class="tab" data-spot-filter="住宿">住宿</button
              ><button class="tab" data-spot-filter="景點">景點</button
              ><button class="tab" data-spot-filter="美食">美食</button
              ><button class="tab" data-spot-filter="活動">活動</button>
            </div>
            <div id="travelList" class="grid" style="margin-top: 14px">
              <div class="muted">尚未同步</div>
            </div>
          </div>
        </section>
        <section id="schedule" class="section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>行事曆</h2>
              </div>
              <div class="row">
                <button id="prevDay" class="btn gray" type="button">
                  前一天</button
                ><input id="dateFilter" type="date" /><button
                  id="nextDay"
                  class="btn gray"
                  type="button"
                >
                  後一天
                </button>
              </div>
            </div>
            <div id="weather" class="weather hidden"></div>
            <div id="calendar" class="calendar" style="margin-top: 14px"></div>
          </div>
        </section>
        <section id="expenses" class="section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>記帳</h2>
              </div>
              <div class="row">
                <button id="exportCsv" class="btn gray">匯出 CSV</button
                ><button id="exportXls" class="btn gray">匯出 Excel</button>
              </div>
            </div>
            <form id="expenseForm" class="form" style="margin-top: 14px">
              <div class="field full">
                <label>項目<input id="expenseName" required /></label>
              </div>
              <div class="field full">
                <label>幣別</label>
                <div class="currency-buttons">
                  <button
                    class="currency-button"
                    type="button"
                    data-currency="TWD"
                  >
                    TWD</button
                  ><button
                    class="currency-button active"
                    type="button"
                    data-currency="ISK"
                  >
                    ISK
                  </button>
                </div>
                <input id="expenseCurrency" type="hidden" value="ISK" />
              </div>
              <div class="field">
                <label
                  >金額<input
                    id="expenseOriginal"
                    type="number"
                    min="0"
                    step="0.01"
                    required /></label
                ><input id="expenseTwd" type="hidden" />
              </div>
              <div class="field">
                <label
                  >類別<select id="expenseCategory">
                    <option>婚禮</option>
                    <option>交通</option>
                    <option>住宿</option>
                    <option>機票</option>
                    <option>餐飲</option>
                    <option>景點／活動</option>
                    <option>購物</option>
                    <option>其他</option>
                  </select></label
                >
              </div>
              <div class="field full">
                <button class="btn green" type="submit">儲存</button>
              </div>
            </form>
          </div>
          <div class="panel expense-view-panel">
            <div id="expenseDateFilters" class="expense-filters"></div>
            <div id="expenseSummary" class="expense-summary">NT$ 0</div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>項目</th>
                    <th>類別</th>
                    <th>原幣別</th>
                    <th>原始金額</th>
                    <th>台幣估算</th>
                    <th>記帳時間</th>
                  </tr>
                </thead>
                <tbody id="expenseList">
                  <tr>
                    <td colspan="6" class="muted">尚未同步</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
        <section id="day1" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D1 行程</h2>
                <div id="day1Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day1Weather" class="weather hidden"></div>
            <div id="day1List" class="grid" style="margin-top: 14px"></div>
            <div id="day1Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day2" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D2 行程</h2>
                <div id="day2Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day2Weather" class="weather hidden"></div>
            <div id="day2List" class="grid" style="margin-top: 14px"></div>
            <div id="day2Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day3" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D3 行程</h2>
                <div id="day3Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day3Weather" class="weather hidden"></div>
            <div id="day3List" class="grid" style="margin-top: 14px"></div>
            <div id="day3Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day4" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D4 行程</h2>
                <div id="day4Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day4Weather" class="weather hidden"></div>
            <div id="day4List" class="grid" style="margin-top: 14px"></div>
            <div id="day4Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day5" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D5 行程</h2>
                <div id="day5Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day5Weather" class="weather hidden"></div>
            <div id="day5List" class="grid" style="margin-top: 14px"></div>
            <div id="day5Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day6" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D6 行程</h2>
                <div id="day6Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day6Weather" class="weather hidden"></div>
            <div id="day6List" class="grid" style="margin-top: 14px"></div>
            <div id="day6Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day7" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D7 行程</h2>
                <div id="day7Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day7Weather" class="weather hidden"></div>
            <div id="day7List" class="grid" style="margin-top: 14px"></div>
            <div id="day7Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day8" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D8 行程</h2>
                <div id="day8Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day8Weather" class="weather hidden"></div>
            <div id="day8List" class="grid" style="margin-top: 14px"></div>
            <div id="day8Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day9" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D9 行程</h2>
                <div id="day9Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day9Weather" class="weather hidden"></div>
            <div id="day9List" class="grid" style="margin-top: 14px"></div>
            <div id="day9Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="day10" class="section day-section">
          <div class="panel">
            <div class="row space">
              <div>
                <h2>D10 行程</h2>
                <div id="day10Label" class="day-label" aria-hidden="true"></div>
              </div>
            </div>
            <div id="day10Weather" class="weather hidden"></div>
            <div id="day10List" class="grid" style="margin-top: 14px"></div>
            <div id="day10Todo" class="todo-list"></div>
          </div>
        </section>
        <section id="links" class="section">
          <div class="panel">
            <h2>特殊備用連結</h2>
            <div
              id="specialLinks"
              class="overview-list"
              style="margin-top: 14px"
            ></div>
          </div>
        </section>
        <nav id="bottomNav" class="bottom-nav">
          <button data-main-tab="overview">總覽</button
          ><button data-main-tab="spots" class="active">景點小卡</button
          ><button data-main-tab="schedule">行程</button
          ><button data-main-tab="expenses">記帳</button
          ><button data-main-tab="links">備用連結</button>
        </nav>
        <div
          id="spotModal"
          class="modal hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="spotModalTitle"
        >
          <div class="modal-card">
            <div class="row space">
              <div>
                <h2 id="spotModalTitle">景點說明</h2>
                <div id="spotModalMeta" class="muted"></div>
              </div>
              <button id="closeSpotModal" class="btn gray" type="button">
                關閉
              </button>
            </div>
            <a
              id="spotModalMap"
              class="btn"
              href="#"
              target="_blank"
              rel="noreferrer"
              style="display: inline-block; margin-top: 12px"
              >地圖</a
            >
            <div id="spotModalBody" class="modal-content"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
