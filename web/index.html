<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰島｜功能測試版</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#24323a;background:#f4f8f7;--blue:#2878aa;--soft:#e9f2f6;--line:#dfe7e5;--red:#b9524b;--green:#3f8769}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #21454a0b}h1{margin:0 0 5px;font-size:28px}h2{margin:0 0 13px;font-size:21px}h3{margin:0 0 7px}.muted{color:#6f7d81}.hidden{display:none!important}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.gray{background:#edf3f3;color:#29434a}.btn.red{background:#fff0ee;color:var(--red)}.btn.green{background:#eaf5ee;color:var(--green)}.status{padding:10px 12px;border-radius:9px;background:#edf5f4;color:#285e65;margin:12px 0}.status.error{background:#fff0ee;color:#963d37}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{border:0;background:#eaf1f2;color:#607277;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;white-space:nowrap}.tab.active{background:var(--blue);color:#fff}.section{display:none}.section.active{display:block}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#68777a;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font:inherit}.field textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}.tag{display:inline-block;font-size:12px;border-radius:999px;padding:3px 8px;background:var(--soft);color:#2474a0}.meta{display:grid;gap:5px;font-size:14px;color:#647276;margin-top:10px}.detail{white-space:pre-wrap;background:#f7faf9;border-radius:9px;padding:10px;margin-top:11px;font-size:13px;max-height:180px;overflow:auto}.research-box{border:1px solid #cfe1e7;background:#f4fafb;border-radius:11px;padding:14px;margin-top:14px}.research-list{display:grid;gap:8px;margin-top:10px}.research-source{padding:10px;border:1px solid var(--line);background:#fff;border-radius:9px}.research-source a{word-break:break-word}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:13px;color:#6b797c;background:#f5f8f8}.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:100px 1fr;gap:11px}.time{padding:12px 0;text-align:right;color:var(--blue);font-weight:800}.timeline-card{border-left:4px solid var(--blue);padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line)}.weather{padding:14px;border:1px solid #cfe1e7;background:#f0f7fa;border-radius:11px;margin-bottom:14px}.login{max-width:560px;margin:70px auto}.small{font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.timeline-item{grid-template-columns:62px 1fr}.time{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginPanel" class="panel login"><h1>冰島｜登入</h1><p class="muted">登入後測試 Notion 景點與費用同步。</p><form id="loginForm" class="form"><div class="field"><label>Email<input id="email" type="email" required autocomplete="email"></label></div><div class="field"><label>密碼<input id="password" type="password" required autocomplete="current-password"></label></div><div class="field full"><button class="btn" type="submit">登入</button></div></form><div id="loginStatus" class="status hidden"></div></section>
<section id="appPanel" class="hidden"><div class="panel"><div class="row space"><div><h1>冰島｜功能測試版</h1><div class="muted">先完成同步功能，最後再調整 UI。</div></div><button id="logout" class="btn red">登出</button></div><div id="status" class="status">尚未同步</div><div class="row"><button id="syncAll" class="btn">同步全部資料</button><button id="addSpotJump" class="btn gray">新增景點</button><button id="addExpenseJump" class="btn gray">新增記帳</button></div></div>
<nav class="tabs"><button class="tab active" data-tab="spots">景點小卡</button><button class="tab" data-tab="schedule">日期行程</button><button class="tab" data-tab="expenses">記帳</button></nav>
<section id="spots" class="section active"><div class="panel"><div class="row space"><div><h2>景點小卡</h2><div class="muted">資料來自 Notion 行程規劃。</div></div><button id="syncTravel" class="btn">同步景點</button></div><div id="travelList" class="grid" style="margin-top:14px"><div class="muted">尚未同步</div></div></div><div class="panel"><h2>從網頁新增景點</h2><p class="muted small">只輸入景點名稱和 Google Maps 連結。按下查詢後，系統會先列出網路來源；你確認後才會建立 Notion 小卡，不會偷偷寫入。</p><form id="spotForm" class="form"><div class="field"><label>景點名稱<input id="spotName" required placeholder="例如：Vík Church／維克教堂"></label></div><div class="field"><label>Google Maps 連結<input id="spotMap" type="url" required placeholder="貼上 Google Maps 網址"></label></div><div class="field"><label>行程日期與時間（可稍後補）<input id="spotTime" type="datetime-local"></label></div><div class="field"><label>分類<select id="spotTag"><option>景點</option><option>住宿</option><option>交通</option><option>美食</option><option>活動</option></select></label></div><div class="field full"><button class="btn" type="submit">1. 查詢網路資料</button></div></form><div id="researchPreview" class="research-box hidden"></div></div></section>
<section id="schedule" class="section"><div class="panel"><div class="row space"><div><h2>日期行程</h2><div class="muted">選日期後，這裡會顯示當日行程與天氣。</div></div><div class="row"><input id="dateFilter" type="date"><button id="syncSchedule" class="btn gray">同步行程</button></div></div><div id="weather" class="weather hidden"></div><div id="timeline" class="timeline" style="margin-top:14px"></div></div></section>
<section id="expenses" class="section"><div class="panel"><div class="row space"><div><h2>記帳</h2><div class="muted">新增後會直接寫入 Notion 5. 費用紀錄。</div></div><div class="row"><button id="syncExpenses" class="btn gray">同步費用</button><button id="exportCsv" class="btn gray">匯出 CSV</button><button id="exportXls" class="btn gray">匯出 Excel</button></div></div><form id="expenseForm" class="form" style="margin-top:14px"><div class="field"><label>項目<input id="expenseName" required></label></div><div class="field"><label>類別<select id="expenseCategory"><option>婚禮</option><option>交通</option><option>住宿</option><option>機票</option><option>餐飲</option><option>景點／活動</option><option>購物</option><option>其他</option></select></label></div><div class="field"><label>原幣別<select id="expenseCurrency"><option>ISK</option><option>TWD</option><option>EUR</option><option>USD</option></select></label></div><div class="field"><label>原始金額<input id="expenseOriginal" type="number" min="0" step="0.01"></label></div><div class="field"><label>台幣估算（自動）<input id="expenseTwd" type="number" min="0" step="0.01" readonly><span id="exchangeHint" class="small muted">輸入幣別與金額後自動換算</span></label></div><div class="field"><label>付款方式<select id="expenseMethod"><option>現金</option><option>刷卡</option></select></label></div><div class="field full"><label>備註<textarea id="expenseNotes"></textarea></label></div><div class="field full"><button class="btn green" type="submit">儲存到 Notion</button></div></form></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>項目</th><th>類別</th><th>原幣別</th><th>原始金額</th><th>台幣估算</th><th>付款方式</th><th>記帳時間</th></tr></thead><tbody id="expenseList"><tr><td colspan="7" class="muted">尚未同步</td></tr></tbody></table></div></div></section>
</section></div>
<script src="./config.js"></script>
<script>
const C=window.ICELAND_APP_CONFIG||{};let session=JSON.parse(localStorage.getItem('iceland-auth-session')||'null'),travel=[],expenses=[],researchDraft=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const show=(id,on)=>$(id).classList.toggle('hidden',!on);function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}
async function auth(path,body){const r=await fetch(`${C.supabaseUrl}/auth/v1/${path}`,{method:'POST',headers:{apikey:C.supabasePublishableKey,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'登入失敗');return j}
async function api(kind,method='GET',body,params={}){if(!session?.access_token)throw Error('請先登入');const u=new URL(C.syncFunctionUrl);u.searchParams.set('kind',kind);for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u,{method,headers:{apikey:C.supabasePublishableKey,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||`同步失敗（${r.status}）`);return j}
function p(r,n){return (r.properties||{})[n]}
function dateOf(r){return p(r,'Time')?.start||''}
function renderTravel(){const list=$('travelList');list.innerHTML=travel.length?travel.map(r=>`<article class="card"><h3>${esc(p(r,'Name')||'未命名景點')}</h3><span class="tag">${esc(p(r,'標籤')||'未分類')}</span><div class="meta"><div>日期：${esc(dateOf(r)||'未安排')}</div><div>摘要：${esc(p(r,'內容摘要')||'尚未填寫')}</div><div>地點：${esc(p(r,'地點')?.address||p(r,'地點')?.name||'尚未填寫')}</div><div><a href="${esc(p(r,'Google Maps 連結')||'#')}" target="_blank" rel="noreferrer">開啟地圖</a></div></div>${r.content?`<div class="detail">${esc(r.content)}</div>`:''}</article>`).join(''):'<div class="muted">目前沒有景點資料。</div>'}
function renderSchedule(){const filter=$('dateFilter').value;const rows=travel.filter(r=>{const d=dateOf(r);return d&&(!filter||d.slice(0,10)===filter)}).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));$('timeline').innerHTML=rows.length?rows.map(r=>`<div class="timeline-item"><div class="time">${esc(dateOf(r).replace('T',' ').slice(0,16))}</div><div class="timeline-card"><h3>${esc(p(r,'Name')||'未命名景點')}</h3><div class="meta"><div>地點：${esc(p(r,'地點')?.address||p(r,'地點')?.name||'尚未填寫')}</div><div>摘要：${esc(p(r,'內容摘要')||'尚未填寫')}</div></div></div></div>`).join(''):'<div class="muted">這個日期沒有行程。</div>';loadWeather(rows,filter)}
async function loadWeather(rows,filter){const box=$('weather');const row=rows[0]||(filter?null:travel.find(r=>dateOf(r)));const date=(filter||dateOf(row||{}).slice(0,10)||'').slice(0,10);const place=row?((p(row,'地點')?.address||p(row,'地點')?.name||p(row,'Name')||'')):'';box.classList.remove('hidden');if(!date){box.textContent='尚未有可查詢的日期：請先在 Notion 行程規劃的 Time 欄位填入日期。';return}if(!place){box.textContent=`${date} 尚未有地點，請先在當日行程填入「地點」；填好後按一次「同步行程」。`;return}try{box.textContent='正在查詢當地天氣…';const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=zh&format=json`).then(r=>r.json());const hit=g.results?.[0];if(!hit)throw Error('找不到地點座標');const f=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=auto&start_date=${date}&end_date=${date}`).then(r=>r.json());if(f.error||!f.daily?.time?.length)throw Error('這個日期太遠，Open-Meteo 目前沒有預報資料');box.innerHTML=`<strong>${esc(date)} 天氣</strong> · ${esc(hit.name||place)}<br>最高 ${esc(f.daily.temperature_2m_max?.[0])}°C／最低 ${esc(f.daily.temperature_2m_min?.[0])}°C · 降雨機率 ${esc(f.daily.precipitation_probability_max?.[0])}% · 最大風速 ${esc(f.daily.windspeed_10m_max?.[0])} km/h<br><span class="small">資料來源：Open-Meteo；遠期日期可能沒有預報，出發前請再次確認。</span>`}catch(e){box.textContent=`${date} 的天氣目前無法取得：${e.message}`}}
function renderExpenses(){const b=$('expenseList');b.innerHTML=expenses.length?expenses.map(r=>`<tr><td>${esc(p(r,'Name'))}</td><td>${esc(p(r,'類別'))}</td><td>${esc(p(r,'原幣別'))}</td><td>${esc(p(r,'原始金額')??'')}</td><td>${esc(p(r,'台幣估算')??'')}</td><td>${esc(p(r,'付款方式'))}</td><td>${esc(p(r,'記帳時間')||'')}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">目前沒有費用資料。</td></tr>'}
async function syncTravel(){try{status('正在同步景點…');travel=(await api('travel','GET',undefined,{content:'true'})).records||[];renderTravel();renderSchedule();status(`景點同步完成：${travel.length} 筆`)}catch(e){status(e.message,true)}}
async function syncExpenses(){try{status('正在同步費用…');expenses=(await api('expenses','GET',undefined,{content:'false'})).records||[];renderExpenses();status(`費用同步完成：${expenses.length} 筆`)}catch(e){status(e.message,true)}}
async function syncAll(){await syncTravel();await syncExpenses()}
async function addExpense(e){e.preventDefault();try{status('正在寫入 Notion…');await api('expenses','POST',{properties:{Name:$('expenseName').value,類別:$('expenseCategory').value,原幣別:$('expenseCurrency').value,原始金額:$('expenseOriginal').value===''?'':Number($('expenseOriginal').value),台幣估算:$('expenseTwd').value===''?'':Number($('expenseTwd').value),付款方式:$('expenseMethod').value,備註:$('expenseNotes').value}});$('expenseForm').reset();$('expenseTwd').value='';$('exchangeHint').textContent='輸入幣別與金額後自動換算';await syncExpenses()}catch(e){status(e.message,true)}}
function researchContent(){const sources=(researchDraft?.sources||[]).map((x,i)=>`${i+1}. ${x.title}\n   ${x.url}\n   ${x.description||''}`).join('\n');return `## 🏷️基本資訊\n- 正式名稱：${researchDraft?.name||$('spotName').value}\n- Google Maps：${$('spotMap').value}\n- 地址：待確認\n- 官方網站：待確認\n- 營業／開放時間：待確認\n- 交通方式：待確認\n- 預訂方式／門票：待確認\n- 建議停留時間：待確認\n\n## 🏷️景點背景\n待確認；請以官方網站、政府／觀光局或官方社群資料為準。\n\n## 推薦吃或推薦買\n待確認。\n\n## 地雷注意\n待確認；出發前以官方公告為準。\n\n## 🏷️VLOG 建議\n待補充。\n\n## 🏷️鏡頭建議\n待補充。\n\n## 資料來源與查證紀錄\n本次先以網路搜尋取得下列來源；建立前未把搜尋摘要當成已確認事實：\n${sources||'沒有找到來源，請改用更完整的正式名稱。'}\n\n查詢時間：${researchDraft?.searchedAt||''}`}
async function researchSpot(){const name=$('spotName').value.trim(),map=$('spotMap').value.trim(),box=$('researchPreview');if(!name||!map){box.classList.remove('hidden');box.textContent='請先填入景點名稱和 Google Maps 連結。';return}try{status('正在查詢網路來源…');box.classList.remove('hidden');box.textContent='正在查詢官方網站、售票頁與可信資料…';researchDraft=(await api('research','GET',undefined,{name,map})).result;const sources=researchDraft.sources||[];box.innerHTML=`<strong>已找到 ${sources.length} 個候選來源</strong><p class="small muted">${esc(researchDraft.note)}</p><div class="research-list">${sources.map(x=>`<div class="research-source"><strong>${esc(x.title)}</strong><br><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.url)}</a><div class="small muted">${esc(x.description||'')}</div></div>`).join('')||'<div class="muted">沒有找到結果。</div>'}</div><div class="row" style="margin-top:12px"><button id="confirmResearch" class="btn green" type="button">2. 建立 Notion 小卡（未確認欄位會標示待確認）</button><button id="cancelResearch" class="btn gray" type="button">取消</button></div>`;status('網路查詢完成，請先點開來源確認');$('confirmResearch').onclick=confirmResearch;$('cancelResearch').onclick=()=>{researchDraft=null;box.classList.add('hidden')}}catch(e){box.classList.remove('hidden');box.textContent=e.message;status(e.message,true)}}
async function confirmResearch(){if(!researchDraft)return;try{status('正在建立景點頁面…');await api('travel','POST',{properties:{Name:researchDraft.name,標籤:$('spotTag').value,Time:$('spotTime').value?new Date($('spotTime').value).toISOString():'','Google Maps 連結':$('spotMap').value,內容摘要:`已查詢 ${researchDraft.sources?.length||0} 個來源；詳細欄位待確認`},content:researchContent()});$('spotForm').reset();researchDraft=null;$('researchPreview').classList.add('hidden');await syncTravel();status('景點小卡已建立到 Notion；請在頁面內補上已確認內容')}catch(e){status(e.message,true)}}
async function addSpot(e){e.preventDefault();await researchSpot()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),600)}
function exportCsv(){const rows=[['項目','類別','原幣別','原始金額','台幣估算','付款方式','記帳時間'],...expenses.map(r=>[p(r,'Name'),p(r,'類別'),p(r,'原幣別'),p(r,'原始金額'),p(r,'台幣估算'),p(r,'付款方式'),p(r,'記帳時間')||''])];download('冰島費用紀錄.csv','\ufeff'+rows.map(x=>x.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
function exportXls(){const rows=expenses.map(r=>`<tr><td>${esc(p(r,'Name'))}</td><td>${esc(p(r,'類別'))}</td><td>${esc(p(r,'原幣別'))}</td><td>${esc(p(r,'原始金額'))}</td><td>${esc(p(r,'台幣估算'))}</td><td>${esc(p(r,'付款方式'))}</td><td>${esc(p(r,'記帳時間')||'')}</td></tr>`).join('');download('冰島費用紀錄.xls','<meta charset="UTF-8"><table border="1"><tr><th>項目</th><th>類別</th><th>原幣別</th><th>原始金額</th><th>台幣估算</th><th>付款方式</th><th>記帳時間</th></tr>'+rows+'</table>','application/vnd.ms-excel;charset=utf-8')}
let rateTimer;async function convertToTwd(){const currency=$('expenseCurrency').value;const amount=Number($('expenseOriginal').value);if(!amount){$('expenseTwd').value='';$('exchangeHint').textContent='輸入原始金額後自動換算';return}if(currency==='TWD'){$('expenseTwd').value=amount;$('exchangeHint').textContent='TWD 直接採用原始金額';return}try{$('exchangeHint').textContent='正在取得最新匯率…';const j=await fetch(`https://api.frankfurter.app/latest?from=${currency}&to=TWD`).then(r=>r.json());const rate=Number(j.rates?.TWD);if(!rate)throw Error('找不到匯率');$('expenseTwd').value=Math.round(amount*rate);$('exchangeHint').textContent=`1 ${currency} ≈ ${rate.toFixed(4)} TWD；匯率來源：Frankfurter`;}catch(e){$('exchangeHint').textContent='匯率取得失敗，請稍後再試';status('台幣換算失敗：'+e.message,true)}}$('expenseCurrency').onchange=convertToTwd;$('expenseOriginal').oninput=()=>{clearTimeout(rateTimer);rateTimer=setTimeout(convertToTwd,350)};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await auth('token?grant_type=password',{email:$('email').value,password:$('password').value});session=j;localStorage.setItem('iceland-auth-session',JSON.stringify(j));show('loginPanel',false);show('appPanel',true);status('登入成功，請同步資料')}catch(err){show('loginStatus',true);$('loginStatus').textContent=err.message;$('loginStatus').className='status error'}};$('logout').onclick=()=>{session=null;localStorage.removeItem('iceland-auth-session');show('loginPanel',true);show('appPanel',false)};$('syncAll').onclick=syncAll;$('syncTravel').onclick=syncTravel;$('syncSchedule').onclick=syncTravel;$('syncExpenses').onclick=syncExpenses;$('expenseForm').onsubmit=addExpense;$('spotForm').onsubmit=addSpot;$('dateFilter').onchange=renderSchedule;$('exportCsv').onclick=exportCsv;$('exportXls').onclick=exportXls;$('addSpotJump').onclick=()=>document.querySelector('[data-tab="spots"]').click();$('addExpenseJump').onclick=()=>document.querySelector('[data-tab="expenses"]').click();document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===t.dataset.tab))});if(session){show('loginPanel',false);show('appPanel',true);status('正在自動同步…');syncAll()}
</script></body></html>
